<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>guns.lol style page</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --text: #ffffff;
      --muted: #a0a0a0;
      --accent: #ff3c3c;
      --border: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* Profile Card */
    .profile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      margin-bottom: 16px;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .username {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    .bio {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      text-align: center;
    }

    .link-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* Editor Panel */
    .editor {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-top: 30px;
    }

    .editor h3 {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .editor label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 12px;
    }

    .editor input,
    .editor textarea {
      width: 100%;
      background: #1c1c1c;
      border: 1px solid var(--border);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .editor textarea {
      min-height: 70px;
      resize: vertical;
    }

    .editor button {
      width: 100%;
      margin-top: 18px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .editor button:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- PROFILE -->
    <div class="profile">
      <img id="avatar" class="avatar" src="https://i.imgur.com/8Km9tLL.png" alt="avatar">
      <div class="name" id="displayName">Your Name</div>
      <div class="username" id="username">@yourname</div>
      <div class="bio" id="bio">This is your bio. Edit it below.</div>
    </div>

    <!-- LINKS -->
    <div class="links" id="links">
      <!-- Links will be generated here -->
    </div>

    <!-- EDITOR -->
    <div class="editor">
      <h3>Create / Edit Page</h3>

      <label>Display Name</label>
      <input type="text" id="inputName" placeholder="Your Name">

      <label>Username</label>
      <input type="text" id="inputUser" placeholder="@yourname">

      <label>Bio</label>
      <textarea id="inputBio" placeholder="Write something about yourself..."></textarea>

      <label>Avatar URL</label>
      <input type="text" id="inputAvatar" placeholder="https://...">

      <label>Links (one per line: Title | URL)</label>
      <textarea id="inputLinks" placeholder="Discord | https://discord.gg/&#10;YouTube | https://youtube.com/&#10;GitHub | https://github.com/"></textarea>

      <button onclick="updatePage()">Update Page</button>
    </div>

    <div class="footer">
      guns.lol style • local only
    </div>
  </div>

  <script>
    // Default data
    const defaultData = {
      name: "Your Name",
      username: "@yourname",
      bio: "This is your bio. Edit it below.",
      avatar: "https://i.imgur.com/8Km9tLL.png",
      links: [
        { title: "Discord", url: "https://discord.gg/" },
        { title: "YouTube", url: "https://youtube.com/" },
        { title: "GitHub", url: "https://github.com/" }
      ]
    };

    // Load saved data or use default
    function loadData() {
      const saved = localStorage.getItem("gunsPage");
      return saved ? JSON.parse(saved) : defaultData;
    }

    function saveData(data) {
      localStorage.setItem("gunsPage", JSON.stringify(data));
    }

    function render(data) {
      document.getElementById("displayName").textContent = data.name;
      document.getElementById("username").textContent = data.username;
      document.getElementById("bio").textContent = data.bio;
      document.getElementById("avatar").src = data.avatar || defaultData.avatar;

      const linksContainer = document.getElementById("links");
      linksContainer.innerHTML = "";

      data.links.forEach(link => {
        if (!link.title || !link.url) return;
        const a = document.createElement("a");
        a.className = "link-btn";
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = link.title;
        linksContainer.appendChild(a);
      });

      // Fill editor fields
      document.getElementById("inputName").value = data.name;
      document.getElementById("inputUser").value = data.username;
      document.getElementById("inputBio").value = data.bio;
      document.getElementById("inputAvatar").value = data.avatar;
      document.getElementById("inputLinks").value = data.links
        .map(l => `${l.title} | ${l.url}`)
        .join("\n");
    }

    function updatePage() {
      const name = document.getElementById("inputName").value.trim() || "Your Name";
      const username = document.getElementById("inputUser").value.trim() || "@yourname";
      const bio = document.getElementById("inputBio").value.trim() || "";
      const avatar = document.getElementById("inputAvatar").value.trim();

      const linksRaw = document.getElementById("inputLinks").value.trim();
      const links = linksRaw
        .split("\n")
        .map(line => {
          const [title, ...urlParts] = line.split("|");
          return {
            title: title?.trim(),
            url: urlParts.join("|").trim()
          };
        })
        .filter(l => l.title && l.url);

      const data = { name, username, bio, avatar, links };
      saveData(data);
      render(data);
    }

    // Init
    render(loadData());
  </script>
</body>
</html>
